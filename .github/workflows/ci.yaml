name: Check CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: 24

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: yarn install

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test --testPathIgnorePatterns integrationTests

  integration:
    needs: check
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.browser == 'Firefox' }}
    strategy:
      fail-fast: false
      matrix:
        browser: ["Chrome", "Edge", "Firefox"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: yarn install
      - run: yarn run build
      - name: Test
        run: yarn test integrationTests -t "${{ matrix.browser }} Integration Test"
